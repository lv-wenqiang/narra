[package]
name = "narra"
version = "0.2.0"
edition = "2024"
# edition 2024 的最低工具链。写上它，工具链太旧的人拿到的是一句清楚的版本要求，
# 而不是一串语法错误。
rust-version = "1.85"
description = "口播文稿 → Edge TTS 旁白与字幕 → 自绘四段画面 → ffmpeg 合成 1080p/竖版成片的命令行工具（运行时需要 ffmpeg）"
license = "MIT"
repository = "https://github.com/lv-wenqiang/narra"
readme = "README.md"
keywords = ["video", "tts", "ffmpeg", "subtitle", "cli"]
categories = ["command-line-utilities", "multimedia::video"]
# 发布包不带 tests/。大头是 tests/baseline/ 那四张逐字节比对的 RGBA 快照：
# 解包后 11MB，下游一个字节都用不上（压缩后只占约 0.1MiB，所以这不是为了
# 挤 crates.io 的 10MiB 上限——那 8.8MiB 里几乎全是内嵌字体）。真正的理由是
# canvas_baseline 那条测试在快照缺失时会先自动生成再报红：只排 baseline、留
# 下测试，等于给发布包塞一条必然失败的测试。测试留在仓库里跑，不进 crate。
exclude = ["tests/"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
cosmic-text = "0.19.0"
futures-util = "0.3.34"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
regex = "1.13.1"
# 用户自备的 SVG 图标（`--watermark-icon`）光栅化。渲染后端就是 tiny-skia，
# 与本项目的 2D 栈同源，不引入第二套图形依赖。
resvg = "0.48.1"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3"] }
tiny-skia = "0.12.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "io-util", "net", "sync", "fs"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
ttf-parser = "0.25.1"
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }

# 渲染测试（尤其 render::frame 的全时间轴测试）耗时几乎全在 cosmic-text/
# tiny-skia 这些依赖里，debug 构建下它们不做任何优化，单帧渲染比 release
# 慢一个数量级。只优化依赖、不动我们自己的 crate（保留完整 debug 信息与
# backtrace），实测能把 render::frame 全量测试从约 169s 降到约 6.6s。
[profile.dev.package."*"]
opt-level = 3
