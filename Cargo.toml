[package]
name = "panda"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
cosmic-text = "0.19.0"
futures-util = "0.3.34"
hex = "0.4.3"
image = "0.25.10"
regex = "1.13.1"
resvg = "0.48.1"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3"] }
tiny-skia = "0.12.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "io-util", "net", "sync", "fs"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
ttf-parser = "0.25.1"
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }
